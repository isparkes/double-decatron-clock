; PlatformIO Project Configuration File
;
; Standalone two-Decatron clock firmware for the "two-decatron-clock" board.
; Board: Wemos/LOLIN D1 Mini (ESP8266)
;
; https://docs.platformio.org/page/projectconf.html

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
board_build.f_cpu = 160000000L
monitor_speed = 115200
monitor_filters = time, esp8266_exception_decoder

; Uncomment and adjust if auto-detection picks the wrong port.
; upload_port = /dev/cu.usbserial*
; monitor_port = /dev/cu.usbserial*
